<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SJ Digital Creatures SplashScreen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090a0f;
    }

    .splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #090a0f;
      background-image: radial-gradient(circle at 50% 40%, rgba(168, 85, 247, 0.18) 0%, rgba(6, 182, 212, 0.1) 40%, rgba(9, 10, 15, 0.98) 80%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      pointer-events: auto;
    }

    .splash-container.fading-out {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* Glow Effects */
    .glow-1 {
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(70px);
      animation: sjPulse 4s infinite alternate ease-in-out;
    }

    .glow-2 {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(60px);
      animation: sjPulse 3s infinite alternate-reverse ease-in-out;
    }

    /* Glass Card */
    .glass-card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 44px 40px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      max-width: 440px;
      width: 90%;
    }

    /* 3D Rotating Logo Container */
    .logo-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      width: 130px;
      height: 130px;
    }

    .orbit-ring-1 {
      position: absolute;
      width: 124px;
      height: 124px;
      border-radius: 36px;
      border: 2px dashed rgba(6, 182, 212, 0.8);
      animation: sjSpinClockwise 7s linear infinite;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .orbit-ring-2 {
      position: absolute;
      width: 108px;
      height: 108px;
      border-radius: 30px;
      border: 2px dotted rgba(168, 85, 247, 0.85);
      animation: sjSpinCounter 10s linear infinite;
    }

    .logo-badge {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 45px rgba(168, 85, 247, 0.8), inset 0 2px 6px rgba(255, 255, 255, 0.6);
      animation: sj3DSpinContinuous 4s linear infinite;
      transform-style: preserve-3d;
    }

    .logo-badge span {
      font-size: 2.6rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.8);
      letter-spacing: -1.5px;
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
    }

    .brand-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-header h1 span {
      color: #06b6d4;
      -webkit-text-fill-color: #06b6d4;
    }

    .brand-header p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin: 6px 0 0 0;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Progress Bar */
    .progress-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7 0%, #06b6d4 100%);
      border-radius: 999px;
      transition: width 0.1s ease-out;
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.9);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }

    .status-text {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .percent-text {
      color: #06b6d4;
      font-weight: 700;
      font-family: monospace;
    }

    /* Skip Button */
    .skip-btn {
      margin-top: 4px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 6px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .skip-btn:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    /* Keyframes */
    @keyframes sjPulse {
      0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.5; }
      100% { transform: scale(1.1) translate(10px, 10px); opacity: 0.9; }
    }
    @keyframes sjSpinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sjSpinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes sj3DSpinContinuous {
      0% { transform: rotateY(0deg) rotateX(5deg); }
      50% { transform: rotateY(180deg) rotateX(-5deg); }
      100% { transform: rotateY(360deg) rotateX(5deg); }
    }
  </style>
</head>
<body>

  <div id="sj-splash" class="splash-container">
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="glass-card">
      <div style="perspective:1000px;display:flex;justify-content:center;margin-bottom:6px;">
        <img src="sj_card.png" alt="SJ Digital Creatures" style="width:320px;max-width:85vw;border-radius:18px;box-shadow:0 20px 45px -10px rgba(6,182,212,0.5),0 0 30px rgba(16,185,129,0.3);border:1px solid rgba(255,255,255,0.2);" />
      </div>

      <div class="brand-header">
        <h1>SJ Digital Creatures<span>.ai</span></h1>
        <p>Autonomous AI Company Incubator</p>
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div id="sj-progress-bar" class="progress-fill"></div>
        </div>
        <div class="progress-meta">
          <span id="sj-status-text" class="status-text">Initializing 7rakni Studio...</span>
          <span id="sj-percent-text" class="percent-text">0%</span>
        </div>
      </div>

      <button id="sj-skip-btn" class="skip-btn" onclick="finishSplash()">Skip Intro &rarr;</button>
    </div>
  </div>

  <script>
    (function () {
      var duration = 2800;
      var startTime = Date.now();
      var splashEl = document.getElementById('sj-splash');
      var barEl = document.getElementById('sj-progress-bar');
      var statusEl = document.getElementById('sj-status-text');
      var percentEl = document.getElementById('sj-percent-text');

      window.finishSplash = function () {
        splashEl.classList.add('fading-out');
        setTimeout(function () {
          splashEl.style.display = 'none';
        }, 500);
      };

      var timer = setInterval(function () {
        var elapsed = Date.now() - startTime;
        var pct = Math.min(100, Math.floor((elapsed / duration) * 100));

        barEl.style.width = pct + '%';
        percentEl.textContent = pct + '%';

        if (pct < 30) {
          statusEl.textContent = 'Initializing Neural Engine...';
        } else if (pct < 60) {
          statusEl.textContent = 'Loading AI Motion Models...';
        } else if (pct < 90) {
          statusEl.textContent = 'Preparing Creative Canvas...';
        } else {
          statusEl.textContent = 'Ready! Welcome to 7rakni';
        }

        if (pct >= 100) {
          clearInterval(timer);
          finishSplash();
        }
      }, 40);
    })();
  </script>

</body>
</html>
